# Soccer Arbitrage Sniper — configuration.
# Everything the engine needs that is not a secret. Secrets (ODDS_PAPI_KEY,
# TELEGRAM_BOT_KEY, TELEGRAM_GROUP_ID) come from the environment / GitHub Actions.

sport_id: 10                         # OddsPapi soccer sportId (confirm via /v4/sports)

# Hard cap on the TOTAL money staked across all legs of any single arb. If an arb's natural T_max
# (set by book limits) would require investing more than this, every leg stake is scaled DOWN
# proportionally so the total equals bankroll_total (guaranteed profit scales down with it). If the
# arb is already smaller than this (limited by real book limits), it is left untouched.
bankroll_total: 30000

# SHADOW-BOOK SCOREBOARD — "which non-funded book should I open an account at next?". Each scan
# aggregates arbs over a rolling window and ranks non-funded books by how many arbs they would
# directly UNLOCK (every OTHER leg already on a funded book). Written to the "shadow_scoreboard"
# sheet of data/arbs_log.xlsx and sent as a once-daily Telegram digest. Suspicious arbs are excluded.
shadow_window_hours: 48              # rolling aggregation window
shadow_digest_hour: 9               # local hour (0-23) to send the once-daily "fund next" digest

# ALERT FILTERS — gate Telegram ALERTS only; detection/logging is unaffected (every arb still goes
# to the CSV + xlsx). An arb is only ALERTED when BOTH hold:
#   * its fixture kicks off within alert_max_days_out days (skip far-off games — lines move first), and
#   * its guaranteed profit (after the $30K bankroll cap + unknown-limit realism) >= alert_min_profit.
alert_max_days_out: 3               # only alert fixtures kicking off within this many days
alert_min_profit: 25               # PER-GAME alert floor: guaranteed profit >= this many dollars
# GROUP-STAGE arbs use their OWN, lower floor (they're small — ~$20 — but real, and window-exempt
# since they resolve at group end). A group arb alerts if profit >= group_alert_min_profit OR its
# ROI >= group_alert_min_roi_pct. Per-game arbs keep using alert_min_profit above.
group_alert_min_profit: 15
group_alert_min_roi_pct: 1.0
# A scan lock (data/scan.lock) older than this many seconds is treated as stale and overridden, so a
# crashed scan can't block all future scans. A healthy scan finishes in ~1-3 min.
scan_lock_max_age_s: 1800

oddspapi:
  # FREE PROFILE. When false, the scan spends ZERO OddsPapi odds requests: per-scan odds come
  # ONLY from the supplemental sources (the-odds-api Pinnacle + 1xBet, Kalshi-direct,
  # Polymarket-direct). OddsPapi is still used — for free — for the budget guard (/v4/account)
  # and for the cached catalog + fixtures name map, which auto-refresh on the TTLs in `budget`
  # below (~1 billable request per names refresh, a few per catalog refresh). This keeps OddsPapi
  # well under ~70 requests/month while every World Cup team still resolves to a real name.
  # Set true to restore the funded profile (one billable odds request per granted book per scan).
  fetch_odds: false

# UTC window we care about. odds-by-tournaments returns ALL events for a league;
# we filter to fixtures whose kickoff falls inside this window and is in the future.
# NOTE: the window is computed dynamically in src/config.py (load_config) — a rolling
# "now -> end of (today + 2 days) 23:59:59Z" UTC range — so there are NO hardcoded dates
# here. A workflow_dispatch run may still override it via the FROM_DATE / TO_DATE env.

tournaments:
  match_name_regex: "world.cup|fifa world cup"   # FIFA World Cup only, via /v4/tournaments
  # Pinned to tournamentId 16 = "World Cup" — the only WC tournament carrying fixtures. Pinning
  # short-circuits regex discovery; clear this list to re-resolve from the API against the regex.
  pinned_ids: [16]
  national_teams_only: true          # World Cup is national-team only; exclude club/simulated variants

bookmakers:
  # Exactly four books are scanned now. Both lists are identical, so every arb is
  # actionable and shadow arbs operate across the same 4 books.
  actionable: [kalshi, polymarket, pinnacle, 1xbet]
  tracked:    [kalshi, polymarket, pinnacle, 1xbet]
  # Treated as betting exchanges: liquidity from exchangeMeta/limit, may charge commission.
  # kalshi <-> polymarket arbs are valid exchange-vs-exchange opportunities and are NOT filtered.
  # betfair-ex/betfair-spb/matchbook/smarkets arrive via the the-odds-api feed (no exchangeMeta),
  # so they carry no live liquidity (limit=None -> low_confidence) but DO charge commission.
  exchanges:  [kalshi, polymarket, betfair-ex, betfair-spb, matchbook, smarkets]
  # Commission charged on net winnings (decimal). Sportsbooks default to 0. The exchange rates below
  # are CONSERVATIVE DEFAULTS — adjust to your actual account tier. Applied via eff_odds in BOTH the
  # actionable and shadow universes, so observed exchange arbs are already net of commission.
  commission:
    # Kalshi and Polymarket are NO LONGER in this map — they now use EXACT per-share taker fees
    # (kalshi 0.07·P·(1−P); polymarket poly_fee_rate·min(P,1−P)) via arbitrage.exchange_fee_rate, folded
    # into the NET fields / og_current sizing. The books below keep the commission-on-net-winnings model.
    betfair-ex: 0.05      # adjustable — standard Betfair Exchange ~2-5%; conservative 5%
    betfair-spb: 0.05     # adjustable — Betfair Sportsbook-via-exchange; conservative 5%
    matchbook: 0.02       # adjustable — Matchbook ~1.5-2%; conservative 2%
    smarkets: 0.02        # adjustable — Smarkets ~2%; conservative 2%
  # Polymarket sports TAKER fee rate (gamma feeSchedule.rate; verified live). Used by the exact exchange
  # fee model for polymarket legs: fee_shares = poly_fee_rate·min(P,1−P)·shares (forfeited at settlement).
  poly_fee_rate: 0.05

theoddsapi:
  # Supplemental SECOND data source (the-odds-api.com, key in ODDS_API_KEY). Fills WC gaps OddsPapi
  # leaves: recovers books it returns suspended (1xbet) and adds soft books (bet365, unibet, …).
  # It gap-fills the OddsPapi feed by canonical fixtureId/marketId/outcomeId, so the arb engine,
  # clone-dedup, and staleness rules apply unchanged. See src/theoddsapi.py.
  enabled: true
  wc_key: soccer_fifa_world_cup      # confirmed active; has_outrights=false (we skip the winner outright)
  regions: eu                        # eu only (pinnacle + 1xbet are eu; uk only added shadow soft books at 2x cost)
  markets: h2h,spreads,totals
  # DO NOT add btts here. The bulk /sports/{key}/odds endpoint rejects it with 422
  # INVALID_MARKET, which poisons the ENTIRE call (Pinnacle + 1xbet vanish). btts needs the
  # per-event odds endpoint — separate future work. Deliberate removal, twice now.
  # MASTER SWITCH: while false, NO the-odds-api leg can form an actionable arb / send a Telegram
  # alert — they are tracked (shadow) only. When true, the per-book allow-list below (actionable_books)
  # is the REAL control over which recovered books may turn an arb actionable.
  actionable: true
  # Per-book actionable allow-list WITHIN the-odds-api (canonical post-alias slugs). Even with the
  # master switch on, ONLY recovered books listed here may make an arb actionable; every other
  # the-odds-api book (the soft books further down) stays shadow-only no matter what. 1xBet is the
  # one the-odds-api book we hold an account on, so it is the sole actionable recovered book.
  # NOTE: a the-odds-api SPREAD additionally needs an OddsPapi book on the same marketId+handicap to
  # validate the sign mapping before it can be actionable (see run._scan). In the FREE PROFILE no
  # OddsPapi odds are fetched, so spreads (asian_handicap) can never be validated and stay shadow —
  # only h2h (1x2) and totals legs from Pinnacle/1xBet turn actionable. Omit/empty => no per-book
  # restriction (any recovered book may be actionable when the master switch is on).
  actionable_books:
    - 1xbet
    - pinnacle           # FREE PROFILE: OddsPapi no longer sources Pinnacle odds; the-odds-api does
  commence_tolerance_minutes: 120    # a fixture matches only if team identity AND kickoff agree within this
  # Canonical-slug allow-list (post-alias). Every the-odds-api book confirmed present in the
  # OddsPapi catalog from the eu/uk shadow run. Omit/empty would ingest all catalog books the feed
  # returns. Pinnacle is now sourced HERE (FREE PROFILE: oddspapi.fetch_odds=false means OddsPapi no
  # longer supplies Pinnacle odds, so there is no double-sourcing to defer to). Aliases
  # (onexbet→1xbet, betfair_ex_*→betfair-ex, unibet_*→unibet, …) live in src/theoddsapi.py.
  books:
    - pinnacle           # FREE PROFILE: the-odds-api is now the sole Pinnacle odds source
    - 1xbet
    - unibet
    - williamhill
    - paddypower
    - skybet
    - coral
    - ladbrokes
    - betway
    - boylesports
    - 888sport
    - betsson
    - nordicbet
    - tipico
    - leovegas
    - casumo
    - grosvenor
    - coolbet
    - virginbet
    - livescorebet
    - winamax.fr
    - winamax.de
    - matchbook
    - betfair-ex
    - betfair-spb
    - betfred
    - betvictor          # in plan grant; needs a bookmaker-catalog refresh to leave the skip list
    - smarkets           # in plan grant; needs a bookmaker-catalog refresh to leave the skip list

kalshi:
  # Supplemental THIRD data source (Kalshi prediction exchange, kalshi.com). No auth for market
  # data. It overrides OddsPapi's suspended `kalshi` entry with live per-match World Cup result
  # odds, merging by canonical fixtureId/marketId/outcomeId exactly like the-odds-api — so the arb
  # engine, clone-dedup, staleness and mapping-guard run unchanged. See src/kalshi.py.
  enabled: true                      # fetch gate ON; kalshi.actionable below keeps it SHADOW-only
  base_url: https://external-api.kalshi.com/trade-api/v2
  # Per-match WORLD CUP RESULT series: KXWCGAME. Event tickers are KXWCGAME-<YYMMMDD><HOME3><AWAY3>
  # (e.g. KXWCGAME-26JUN12USAPAR), one event per match with 3 mutually-exclusive Yes markets —
  # home win / Tie / away win, settled at 90 min + stoppage (regulation 1X2). NOT KXMENWORLDCUP
  # (the tournament winner outright, out of scope).
  series_ticker: KXWCGAME
  # SAFE-TIER extra series (audit-confirmed identical regulation settlement — 90'+stoppage, no extra
  # time — so they match standard bookmaker totals/BTTS). KXWCTOTAL = total goals O/U (Over X.5 from
  # yes_ask, Under from no_ask); KXWCBTTS = both teams to score Yes/No. Blank to disable a tier.
  # NOT here (settlement/scope risk, deferred): KXWCGOAL (anytime scorer — settles INCLUDING extra
  # time, needs a player-name normalizer + settlement gate), KXWCFIRSTGOAL, KXWCCORNERS.
  totals_series: KXWCTOTAL
  btts_series: KXWCBTTS
  # SHADOW gate (separate from the `kalshi` slug already in bookmakers.actionable): while false, any
  # arb containing a kalshi-DIRECT leg is forced non-actionable, so kalshi-direct stays shadow-only
  # for verification across a few live runs — exactly like the the-odds-api rollout. Flip to true
  # once the recovered prices/limits/fixtures look right in the logs/CSV.
  actionable: true
  # Events are matched to canonical fixtures by normalized team names + the event-ticker DATE on the
  # UTC calendar day (no precise kickoff in the ticker), so there is no ±minutes tolerance knob here.

polymarket:
  # Supplemental FOURTH data source (Polymarket prediction exchange, polymarket.com). Read-only
  # PUBLIC APIs, NO auth, NO trading: Gamma (gamma-api.polymarket.com) for event discovery + CLOB
  # read (clob.polymarket.com) for live best-ask prices/depth. Like kalshi it merges by canonical
  # fixtureId/marketId/outcomeId, so the arb engine/clone-dedup/staleness/mapping-guard run unchanged.
  # A WC match = ONE Gamma event (negRisk) with 3 binary Yes/No markets — home win / Draw / away win;
  # we price each from the CLOB best ASK (decimal=1/ask) and its size (real limit). See src/polymarket.py.
  enabled: true                      # fetch gate ON; polymarket.actionable below keeps it SHADOW-only
  gamma_base: https://gamma-api.polymarket.com
  clob_base: https://clob.polymarket.com
  clob_max_workers: 8                # concurrent CLOB best-ask fetches (the per-game speed fix)
  series_slug: soccer-fifwc          # WC event series; series-scan fallback for a game's SAFE-TIER
                                     # siblings when the direct '<slug>-more-markets' fetch misses
  # SHADOW gate (separate from the `polymarket` slug already in bookmakers.actionable): while false,
  # any arb containing a polymarket-DIRECT leg is forced non-actionable, so polymarket-direct stays
  # shadow-only for verification across a few live runs — exactly like the kalshi / the-odds-api
  # rollout. When OddsPapi already supplies an ACTIVE polymarket book for a fixture we DEFER to it (it
  # carries more market types); polymarket-direct only fills fixtures OddsPapi left without one. Flip
  # to true once the recovered prices/limits/fixtures look right in the logs/CSV.
  actionable: true
  # Events are matched to canonical fixtures by normalized team names + the match DATE on the UTC
  # calendar day (anchored at noon, ±1-day cross-midnight tolerance), like kalshi — no ±minutes knob.

# DEPTH-AWARE Polymarket leg pricing. The CLOB best-ask TICK over-states profit on thin/flickering
# legs (live: Germany-Paraguay Draw quoted 5.2632 at $10k but Polymarket's real avg fill was ~5.135),
# minting phantom REAL arbs. With poly_depth_pricing ON we WALK the ask ladder to the per-leg stake
# (poly_walk_stake, in shares) and quote 1 / that size-weighted avg fill — the exact "Avg. Price"
# Polymarket shows — while the leg limit stays the fillable dollar depth within poly_depth_slippage_pct
# of the best ask. So a deep favorite walks ~entirely at its best ask (≈ unchanged) while a thin leg
# blends into worse levels (worse odds) and the arb shrinks below the alert threshold. Set
# poly_depth_pricing:false to restore the legacy top-of-book tick (rollback / A-B comparison).
# poly_walk_stake 0 -> walk to each leg's own fillable band. Read ONLY in the scanner (src/run.py).
poly_depth_pricing: true
poly_depth_slippage_pct: 2.0
poly_walk_stake: 10000

player_props:
  # STEP 5 — player-GOALS arbs: Polymarket per-game '-player-props' (1+ goals, reg-90) <-> Kalshi
  # KXWCGOAL (1+ goals, INCL extra time). Default OFF. SETTLEMENT GATE: the two bases only coincide
  # when no extra time is possible, so ONLY group-stage fixtures are paired; knockouts are SKIPPED.
  # Heavier (extra Kalshi/Poly/CLOB calls) — enable only when you want this tier.
  enabled: false
  actionable: false                  # shadow-first rollout: log player arbs but don't alert yet
  kalshi_goal_series: KXWCGOAL
  # Fixtures kicking off on/after this UTC instant are knockout (extra time possible) -> skipped.
  # 2026 World Cup group stage runs through ~Jun 27; the Round of 32 begins after.
  knockout_start_utc: "2026-06-28T00:00:00Z"

group_markets:
  # Cross-exchange GROUP-STAGE OUTCOME markets (Kalshi KXWCGROUP* <-> Polymarket group events).
  # SCOPE_GROUP, kept separate from the per-game path. Default OFF (heavier: extra Kalshi/Poly/CLOB
  # calls). SAFE types — Group Winner + Group Bottom (both venues: finishes 1st / last, FIFA tiebreak)
  # — may be actionable. DANGEROUS qualify/advance markets are detected + logged but NEVER actionable
  # (their resolution definitions differ across venues — see the audit). These freeze capital until
  # the group stage ends, so every group arb is tagged capital_lockup_days.
  enabled: false
  actionable: false                  # SAFE group arbs only; flip true once you accept the ~10d lockup
  group_stage_end_utc: "2026-06-27T23:59:59Z"   # when group markets resolve (capital-lockup anchor)
  poly_tag_id: "102232"              # Polymarket FIFA World Cup tag
  max_clob_calls: 60                 # per-scan CLOB budget for the group tier (stops early + logs)
  slugmap_cache_hours: 6             # cache the (static) Kalshi-group<->Poly-event slug/token map

markets:
  exclude: [double_chance]           # market families to never scan (overlap 1x2 → bad for arbing)
  exclude_names: ["double chance"]   # case-insensitive substrings of marketName to drop
  allow_quarter_lines: false         # Asian quarter lines (e.g. 2.75) are NOT clean 2-way arbs
  # SCOPE GUARD (resolve-within-window): we only scan per-match markets that SETTLE by the
  # fixture's kickoff/end — those resolve well inside the 2-day scan window. Tournament-level
  # futures (outright winner, group winner, golden boot, to-qualify/advance/reach-the-final, …)
  # resolve weeks out and are explicitly OUT of scope. Any market whose name contains one of these
  # case-insensitive substrings is skipped — even if it is 2-/3-way shaped and would otherwise
  # classify as 1x2/handicap. Tune this list if the feed starts carrying new long-dated markets.
  exclude_future_names:
    - outright
    - to qualify
    - to advance
    - to reach
    - reach the final
    - finalist
    - golden boot
    - golden ball
    - golden glove
    - top goalscorer
    - top scorer
    - tournament winner
    - group winner
    - winner of group
    - to win group
    - to win the group
    - to win their group
    - group betting
    - stage of elimination
    - to be eliminated
    - to win the tournament
    - to win outright
    - to lift
    - to win the world cup
    - champion

mapping_guard:
  # Outcome-mapping sanity check. We ALWAYS key odds off the canonical outcomeId, but a book can
  # arrive (upstream) with home/away — or the two sides of a 2-way market — swapped, which would
  # mint a phantom arb (a heavy favourite shown as the underdog). On any market with a clear
  # favourite we compare each book to a trusted reference; a book that ranks the favourite and
  # underdog the OPPOSITE way is marked outcome_mapping_suspect and dropped for that market only.
  enabled: true
  reference_books: [pinnacle, 1xbet]   # truth source — first one present in the market wins
  min_favorite_ratio: 1.5              # only judge when reference underdog_odds >= this × favourite_odds
  dump_book: ""                        # set to a slug (e.g. bcgame) to log its raw per-outcome odds
                                       #   (env DEBUG_DUMP_BOOK overrides this for a one-off run)

thresholds:
  min_roi_pct: 0.5                   # ignore arbs below this ROI
  roi_suspicious_pct: 8.0            # above this → flag suspicious (likely stale/error line)
  min_total_stake: 20                # ignore arbs whose T_max is below this (liquidity junk)
  # Staleness is TIME-TO-KICKOFF-AWARE (replaces the old flat max_leg_age_minutes: 20). Soft books
  # hold steady pre-match lines for hours, so a flat 20-min cut threw away valid odds. A leg's price
  # is skipped if its changedAt is older than the limit for its fixture's time-to-kickoff bucket:
  #   kickoff > stale_far_horizon_hours away         -> max_leg_age_far_minutes  (lines barely move)
  #   between near & far horizon                      -> max_leg_age_mid_minutes
  #   within stale_near_horizon_hours of kickoff      -> max_leg_age_near_minutes (lines move fast)
  max_leg_age_far_minutes: 360       # >6h to kickoff: allow legs up to 6h old
  max_leg_age_mid_minutes: 60        # 1–6h to kickoff: allow legs up to 60 min old
  max_leg_age_near_minutes: 20       # <1h to kickoff: keep the tight 20-min cut
  stale_far_horizon_hours: 6         # boundary between the "far" (360m) and "mid" (60m) buckets
  stale_near_horizon_hours: 1        # boundary between the "mid" (60m) and "near" (20m) buckets
  near_miss_ceiling_S: 1.02          # count markets with 1.00 <= S <= this as near-misses
  closest_report_count: 10           # how many "closest to an arb" markets to print each run
  csv_dedup_minutes: 90              # same signature seen within this window → UPDATE row, don't duplicate
  low_confidence_limit_floor: 10     # any leg with limit null or < this ($) → low_confidence (kept, flagged)
  # UNKNOWN-LIMIT REALISM. Many books (the-odds-api: 1xbet, unibet, skybet, …) report NO stake limit.
  # Treating those legs as bottomless produced fantasy T_max values (e.g. $156K "available" on 1xbet).
  # Instead every limit-less leg is capped at this assumed executable size in the T_max/binding calc,
  # so sizes stay realistic, and the leg is flagged UNVERIFIED in alerts + the xlsx log. Override
  # per book below (e.g. a book you know holds more). A leg WITH a real reported limit is unaffected.
  assumed_unknown_limit: 1000        # default assumed max stake ($) for any leg lacking a real limit
  # 1xbet is treated as bettable at ANY size; the user sizes it manually. Effectively uncapped so its
  # legs are never depth-throttled in T_max. Add other per-book overrides here, e.g. {pinnacle: 5000}.
  assumed_unknown_limit_by_book: {1xbet: 100000}

telegram:
  rank_by: profit                    # profit (= roi * T_max) | roi
  local_tz: "America/Toronto"
  # HEARTBEAT: when a scan finds zero REAL (funded, bettable) arbs, send a short "bot alive" ping so
  # the group knows scanning is healthy. Throttled to at most once per heartbeat_min_interval_min to
  # avoid burying you (the VM scans every ~10 min = up to 144/day). Set the interval to 0 to ping on
  # EVERY scan. REAL arbs always alert immediately, independent of this throttle. Last-sent time is
  # tracked in data/cache/notify_state.json (last_heartbeat_utc).
  heartbeat_enabled: true
  heartbeat_min_interval_min: 30

budget:
  safety_margin: 15                  # pre-flight guard: if (limit - count) <= this, skip the scan (exit 0)
  # Names map TTL. The scan auto-refreshes the fixtures name map (fixtureId -> real team names) when
  # the cache is older than this — ~2 refreshes/day at 12h. This is the ROOT-CAUSE FIX for stale
  # "Team NNNN" placeholders: it keeps names current as the rolling window moves forward. Each refresh
  # costs 1 billable OddsPapi request per pinned tournament (1 here), so ~2/day ≈ 60 requests/month.
  names_cache_hours: 12
  # Catalog TTL (sports/bookmakers/markets/tournaments). These are near-static for a fixed tournament,
  # so they refresh far less often than names. A refresh costs ~4 billable requests; at 14 days that
  # is only ~8 requests/month, keeping the OddsPapi total comfortably under ~70/month. The scan also
  # refreshes the catalog immediately if it is missing entirely (budget permitting).
  catalog_cache_hours: 336
  refresh_min_remaining: 24          # only auto-refresh missing/stale catalogs if at least this many requests remain
  # NO per-cycle book cap: every scan fetches ALL usable books your plan grants (one billable
  # request each), so any pair of books can form an arb. If the key runs out of credits or is
  # rate-limited mid-fetch (HTTP 429/403), the run prints "API Key exhausted" and exits cleanly.

api:
  odds_verbosity: 3                  # higher = more markets/lines; bump if markets are missing
  odds_format: decimal

# ===========================================================================
# AUTOMATED EXECUTOR (src/executor/) — kalshi<->polymarket pre-game arb auto-fill.
# COMPLETELY SEPARATE from the scanner above: the executor only READS detected arbs and the
# read-only pricing in src/kalshi.py / src/polymarket.py; it never changes scan behavior. It
# has its own logs (data/executor/), its own ledger (data/executor/trade_ledger.csv), and the
# THREE master switches below default to the safe state (OFF + dry-run + human-confirm). A
# data/executor/STOP file halts it immediately regardless of these flags.
# ===========================================================================
executor:
  # ---- master switches (checked every cycle) -------------------------------
  enabled: false                     # MASTER KILL SWITCH. While false NOTHING runs live, ever.
  dry_run: true                      # while true NO real order is ever placed (measure-only).
  require_human_confirm: true        # CLI y/N gate immediately before each LIVE placement.
  live_enabled: false                # in-play WebSocket detection feed (Phase B). Separate from the
                                     # pre-game path; even when true it stays dry-run (no placement).

  # ---- guardrails (Phase 4 — ALL enforced before every placement) ----------
  max_per_trade_usd: 10              # cap on intended notional per single arb attempt
  max_trades_per_day: 20            # max LIVE trade attempts counted per UTC day
  max_daily_spend_usd: 200          # max total LIVE notional placed per UTC day
  max_daily_loss_usd: 50            # realized LIVE loss cap per UTC day -> trips STOP
  min_book_liquidity_mult: 1.25     # both books must show >= this x your size at target price
  max_consecutive_errors: 3         # this many adapter errors in a row -> trips STOP
  cooldown_seconds: 60              # min seconds between LIVE placements
  dedupe_minutes: 5                 # don't re-fire the same structural arb within this window
  min_net_edge_pct_after_costs: 1.0 # require modeled net edge >= this % after fees+slippage

  # ---- sizing knobs (proven tricks ported from the sibling bot) ------------
  volume_haircut: 0.80              # request ~80% of observed depth so FOK is likely to fill
  marketable_buffer: 0.01          # cross the book by 1 tick when sending a marketable limit

  # ---- venue endpoints (trading; market-data reuses the scanner's bases) ----
  kalshi_api_base: https://api.elections.kalshi.com/trade-api/v2
  poly_signature_type: 3            # default 3 = deposit/proxy wallet (overridable via env)

# ===========================================================================
# GENZ ENGINE (src/genz/) — STANDALONE Kalshi<->Polymarket soccer arbitrage.
# Fully separate from the OG scanner (run.py): its own data path (data/genz/), its own static match
# tree, its own fast price loop. Two jobs: (1) build-tree hourly enumerates every market on both
# venues per game and pairs outcomes deterministically into data/genz/match_tree.json; (2) run --loop
# reads live prices ONLY for tree tokens and checks 2-outcome best-of-both arbs. Execution is
# delegated to the executor above, so the THREE master switches there (enabled/dry_run/
# require_human_confirm) govern GenZ too — with their defaults GenZ measures only (writes
# data/genz/genz_arbs.csv, places nothing). See src/genz/README.md for the Task Scheduler setup.
# ===========================================================================
genz:
  lookahead_hours: 48               # discover WC games kicking off within this window
  # CADENCE — MEASURED 2026-07-28 (per-phase, in the "[GENZ] cycle timing" log line), not a target.
  # After the 19-league expansion a soccer cycle runs ~340s (5 consecutive production cycles:
  # 327/354/334/341/342s) against an interval that still said 20 — a leftover from the 2-league era that
  # made the panel read "LIVE" while the data was five cycles old.
  # WHERE THE TIME GOES (exact, from the per-phase log line):
  #   331.2s total = 49.9s pricing + 0.1s snapshot + 281.1s papermaker
  # Pricing all 120 games / 584 two-way nodes (584 Kalshi + 584 Polymarket orderbook fetches, 12 workers,
  # each client spacing requests >=0.5s) is 15%. The PAPERMAKER — a dry-run shadow measurement that places
  # nothing — is 85% of the soccer detection cycle. So neither max_workers nor the rate-limit cushion is
  # the constraint, and parallelising PRICING per competition would buy almost nothing.
  # This value is set to the true cadence (~340s cycle + the runner's 20s sleep) and is what the panel now
  # derives its SLOW/STALE thresholds from. If the cadence has to come down, the only thing worth touching
  # is the papermaker pass — and the honest question there is whether a shadow measurement should cost 85%
  # of the loop that finds real arbs.
  interval_seconds: 360             # price-loop cadence (measured: ~340s cycle + 20s runner sleep)
  max_workers: 12                   # concurrent REST price fetches per cycle (pricing is 15% — not the bottleneck)
  walk_stake_usd: 200               # stake each book is walked to for the realized (walk-to-stake) fill
  min_edge_pct: 1.0                 # implied-cost edge floor (after costs) to flag/attempt an arb
  max_plausible_roi_pct: 8          # arbs above this ROI (or implied_cost<0.5) are pairing/staleness
                                    # bugs -> rejected (never auto-traded). A real 2-outcome soccer arb is
                                    # low single digits (corners top out ~5%); >8% is far more likely a bug.
  min_total_implied: 0.95           # a same-line/period Over+Under MUST sum ~1.0 (like corners). A totals
                                    # O/U node summing below this is a period/line mispairing -> rejected.
  http_timeout_seconds: 15          # per-call HTTP timeout — fail fast so one hung call can't stall a cycle
  poly_series_slug: soccer-fifwc    # Polymarket WC series; siblings discovered by game-slug prefix

  # IN-PLAY DATA COLLECTION (shadow ONLY — live TRADING stays locked everywhere; in-play is additionally
  # hard-forbidden for live by assertion). A started game within kickoff+horizon_hours is PRICED and
  # flagged phase="inplay" (would_trade FORCED false, executor dry-run SKIPPED, arbs CSV rows get
  # inplay=1); beyond the horizon the game is dropped. Per-sport horizons live in each sub-block below.
  inplay:
    collect: true
    horizon_hours: 3.0              # soccer: ~2h match + stoppage/ET buffer
  # SOCCER POST-WC — competition-driven discovery (the World Cup is over). Each competition names its
  # Kalshi game-winner series (AUTO -> discovered from the catalog, REPORTED, and persisted to
  # data/genz/soccer_series_map.json; or an explicit list) and its Polymarket slug prefix. A competition
  # simply not listed on a venue reports ZERO honestly (never forced). The world_cup entry keeps the
  # KXWCGAME/fifwc constants (disabled here; ENABLED it reproduces the legacy path — the golden pins it).
  # Families/match_rules (periods, settlement, twin keys) are competition-AGNOSTIC and unchanged. Empty/
  # absent competitions -> the legacy World Cup path (byte-identical). Friendlies caveat: no extra time /
  # odd sub rules — the existing settlement-period parser + guards already handle the divergence.
  # EVERY poly_slug_prefix below was READ OFF A REAL PAYLOAD on 2026-07-28 — never guessed. The
  # discovery sweep enumerated all 1,466 soccer-tagged Kalshi series (95 *GAME), found 26 with games
  # inside the window, and asked Polymarket for each one's actual fixtures; the example slug beside
  # each line is the live event that fixed its prefix. tests/test_soccer_leagues.py pins both halves
  # (keyword -> exactly one Kalshi series, prefix -> the captured slug) against committed fixtures.
  soccer:
    competitions:
      - {name: mls,             kalshi_series: AUTO, poly_slug_prefix: mls,           enabled: true}
      # poly_slug_prefix VERIFIED against live payloads 2026-07-28: Polymarket uses 'clf'
      # (clf-avl-rso-2026-07-28 = Aston Villa vs Real Sociedad), NOT 'club-friendly'. The wrong prefix
      # rejected 94 of 95 Kalshi friendlies before the club-name matcher was ever consulted.
      - {name: club_friendlies, kalshi_series: AUTO, poly_slug_prefix: clf,            enabled: true}
      - {name: ucl_qualifying,  kalshi_series: AUTO, poly_slug_prefix: ucl,           enabled: true}
      # --- LEAGUE EXPANSION 2026-07-28 — present on BOTH venues, one game dumped raw per league ---
      # UEFA: the Europa/Conference qualifiers run alongside the Champions League ones. NOTE the
      # Conference League's Poly prefix is 'col' (COnference League) — NOT Colombia, which is 'col1'.
      # startswith(prefix + '-') keeps them disjoint ('col1-...' never matches 'col-').
      - {name: uefa_europa_league,     kalshi_series: AUTO, poly_slug_prefix: uel,   enabled: true}   # uel-csk1-qar-2026-07-30
      - {name: uefa_conference_league, kalshi_series: AUTO, poly_slug_prefix: col,   enabled: true}   # col-al-dil-2026-07-28
      - {name: argentina_primera,      kalshi_series: AUTO, poly_slug_prefix: arg,   enabled: true}   # arg-ros-rac-2026-07-28
      - {name: brasileirao,            kalshi_series: AUTO, poly_slug_prefix: bra,   enabled: true}   # bra-flu-bah-2026-07-29
      - {name: brasileirao_b,          kalshi_series: AUTO, poly_slug_prefix: bra2,  enabled: true}   # bra2-fec-bot-2026-07-28
      - {name: conmebol_sudamericana,  kalshi_series: AUTO, poly_slug_prefix: sud,   enabled: true}   # sud-tig-nac-2026-07-28
      - {name: liga_mx,                kalshi_series: AUTO, poly_slug_prefix: mex,   enabled: true}   # mex-jua-pum-2026-07-31
      - {name: nwsl,                   kalshi_series: AUTO, poly_slug_prefix: nwsl,  enabled: true}   # nwsl-bay-got-2026-07-29
      - {name: ekstraklasa,            kalshi_series: AUTO, poly_slug_prefix: pol,   enabled: true}   # pol-mot-jag-2026-07-31
      - {name: eliteserien,            kalshi_series: AUTO, poly_slug_prefix: nor,   enabled: true}   # nor-bog-lil-2026-07-31
      - {name: usl_championship,       kalshi_series: AUTO, poly_slug_prefix: uslc,  enabled: true}   # uslc-lc-bir-2026-07-29
      - {name: chinese_super_league,   kalshi_series: AUTO, poly_slug_prefix: chi,   enabled: true}   # chi-hen-ygb-2026-07-31
      - {name: liga_dimayor,           kalshi_series: AUTO, poly_slug_prefix: col1,  enabled: true}   # col1-cab-llf-2026-07-30
      - {name: croatia_hnl,            kalshi_series: AUTO, poly_slug_prefix: hr1,   enabled: true}   # hr1-din-sla-2026-08-01
      - {name: peru_liga_1,            kalshi_series: AUTO, poly_slug_prefix: per1,  enabled: true}   # per1-clc-ccu-2026-07-31
      - {name: scottish_premiership,   kalshi_series: AUTO, poly_slug_prefix: scop,  enabled: true}   # scop-dun-ran-2026-07-31
      - {name: uruguay_primera,        kalshi_series: AUTO, poly_slug_prefix: uru1,  enabled: true}   # uru1-tor-wan-2026-07-31
      - {name: czech_first_league,     kalshi_series: AUTO, poly_slug_prefix: cze1,  enabled: true}   # cze1-asp-fcz-2026-07-31
      # Bolivia: Polymarket DOES run this league ('bol1-tom-abb-2026-06-20', 'bol1-uvi-gua-2026-06-19'
      # — the same clubs Kalshi lists), but it had posted no fixture overlapping our window at
      # discovery time. Enabled with the real prefix so it pairs the moment Poly posts one; until
      # then it reports an honest zero rather than a guess.
      - {name: bolivia_primera,        kalshi_series: AUTO, poly_slug_prefix: bol1,  enabled: true}   # bol1-tom-abb-2026-06-20
      # --- KALSHI-ONLY at discovery (checked, genuinely absent on Polymarket) -> deliberately NOT
      # listed, so they cost no requests and report nothing. Re-check when Poly widens coverage:
      #   KXAPFDDHGAME    Paraguay APF Division de Honor (6 games) — Poly carries these CLUBS only via
      #                   Libertadores/Sudamericana ('lib-2ma-cri-...', 'sud-tri-clo-...'), not the
      #                   domestic league.
      #   KXASEANGAME     ASEAN (2 games)                — no Poly soccer event for either fixture.
      #   KXLIGAEXPGAME   Liga Expansion MX (1 game)     — no Poly soccer event.
      #   KXCANPLGAME     Canadian Premier League (1)    — no Poly soccer event (a fuzzy 'wta-doubles-…'
      #                   tennis hit was the only thing search returned; correctly rejected on prefix).
      - {name: world_cup,       kalshi_series: [KXWCGAME], poly_slug_prefix: fifwc,   enabled: false}
  # MLB — a SECOND sport, fully isolated (its own tree/snapshot/heartbeat/arbs/papermaker files). Only
  # the keys below differ from the soccer defaults above; everything else (walk_stake_usd, min_edge_pct,
  # max_plausible_roi_pct, min_total_implied, http_timeout_seconds, max_workers, poly_fee_rate) is
  # INHERITED. Driven by `--sport mlb`; the soccer pipeline is untouched. See src/genz/sports_mlb.py.
  mlb:
    lookahead_hours: 72             # MLB games post ~a day out; a shorter window keeps the token count sane
    interval_seconds: 45            # slower cycle than soccer (fewer, slower-moving pre-game books)
    kalshi_series: [KXMLBGAME, KXMLBTOTAL]   # moneyline (ml2) + total runs ladder
    poly_slug_prefix: mlb           # Polymarket MLB series slug; event slug = mlb-<away>-<home>-<YYYY-MM-DD>
    kalshi_min_interval: 0.5        # per-process Kalshi request spacing (separate process from soccer)
    inplay: {collect: true, horizon_hours: 4.5}   # a 9-inning game runs ~3h; 4.5h covers extras + rain delays

  # TENNIS — a THIRD sport, fully isolated (tennis_tree.json + genz_*_tennis files). match_winner ONLY
  # in v1 (sets/games are the corners trap across venues). Driven by `--sport tennis`; soccer + MLB are
  # untouched. See src/genz/sports_tennis.py. Everything not listed here is INHERITED from genz.
  tennis:
    lookahead_hours: 72             # tennis draws post ~2-3 days out
    interval_seconds: 60            # pre-game winner books move slowly
    kalshi_series: [KXATPMATCH, KXWTAMATCH]   # ATP + WTA match-winner (one event per match, 2 markets)
    poly_tours: [atp, wta]          # Polymarket series slugs scanned per build; event slug <tour>-<s1>-<s2>-<date>
    kalshi_min_interval: 0.5        # per-process Kalshi request spacing (separate process)
    inplay: {collect: true, horizon_hours: 4.5}   # a best-of-5 match can run 4h+

  # UFC — a FOURTH sport, fully isolated (ufc_tree.json + genz_*_ufc files). fight_winner ONLY in v1
  # (method/round/distance markets are the corners trap across venues). Driven by `--sport ufc`; the
  # other three sports are untouched. See src/genz/sports_ufc.py. Everything not listed is INHERITED.
  ufc:
    lookahead_hours: 168            # cards are WEEKLY — a short window is empty most days
    interval_seconds: 90            # pre-fight winner books move slowly
    kalshi_series: [KXUFCFIGHT]     # one event per fight, 2 per-fighter YES markets
    poly_sport: ufc                 # Polymarket series slug scanned per build (slugs are UNDERIVABLE -> scan only)
    kalshi_min_interval: 0.5        # per-process Kalshi request spacing (separate process)
    inplay: {collect: true, horizon_hours: 1.5}   # a fight is a few min but the card slot slides; short window

# PAPER MAKER — DRY-RUN measurement of the maker-side edge with SYNTHETIC quotes. It NEVER places an
# order and NEVER touches the executor/order API; it just measures whether a passive (maker-fee-free)
# leg + an aggressive hedge would clear the target net. Driven from the genz price cycle. See
# src/genz/papermaker.py. Fills are UNDERCOUNTED (20s sampling misses fast wicks) -> a lower bound.
papermaker:
  enabled: true
  target_net_pct: 1.0               # min net edge (%) a hedged maker combo must clear at the quote price
  ref_shares: 100                   # shares to walk the hedge book to when marking a synthetic fill

# ===========================================================================
# maker_rt — the REALTIME maker/hedger (src/genz/maker_rt/). A single asyncio process on real
# websockets (Poly market + Kalshi orderbook) that rests PAPER maker quotes and shadow-fills them from
# public trade prints, marking the fee-inclusive hedge on the live book. SHADOW is the default: it
# places NOTHING. The live-order path is fully built + unit-tested but HARD-LOCKED behind live.enabled
# (false here) AND an on-disk arm file AND a startup self-check. Run: python -m src.genz.maker_rt.
# ===========================================================================
maker_rt:
  max_games: 30                     # nearest-by-kickoff games to quote across BOTH sports combined
  # PER-SPORT UNIVERSE MAP (H4). max_games alone is ONE nearest-by-kickoff queue and soccer's fixture
  # density wins it outright: the observed universe was 92% soccer (120 of 130 markets), tennis 5, mlb 5,
  # ufc 0 — and the next UFC card sat at queue position 172, so it became quotable only on fight day.
  # These sum to 30, i.e. the SAME total universe, redistributed. A sport not listed here is not capped
  # per-sport; max_games still bounds the union.
  max_games_per_sport:
    soccer: 18
    mlb: 6
    tennis: 4
    ufc: 2
  # PER-SPORT LIVE/SHADOW SWITCHES (F13). ALL TRUE = today's behaviour exactly; this ships the mechanism,
  # not a policy change. A sport set false stops placing REAL orders but keeps evaluating and quoting
  # SHADOW, so its achievable ladder and quote rows keep accumulating — which is the whole point: the
  # measurement that would justify turning it back on does not stop when you stop risking on it.
  # Change these only against the --gates report (see maker_rt --gates), never on a hunch.
  sports:
    soccer: {live: true, live_inplay: true}
    mlb:    {live: true, live_inplay: true}
    tennis: {live: true, live_inplay: true}
    ufc:    {live: true, live_inplay: true}
  quote_usd: 100                    # shadow quote notional per node/direction
  # Min net edge a hedged maker combo must clear at the quote price. LOWERED 1.0% -> 0.6% to raise fill
  # frequency: FILLS are the bottleneck, not edge availability (rails-clean achievable data shows ~9% of
  # tennis/mlb moments clear 1%, but very few of those quotes ever get taken). Floor chosen so that after
  # the worst realistic hedge slippage (~0.3%) a fill still clears costs. This buys MORE at-best resting
  # bids, not riskier ones — caps, in-play rails and the hedge-depth precondition are deliberately
  # unchanged, so a thinner edge still requires a provable hedge before anything rests.
  # REVISIT once >= 20 real fills have accumulated: read summary.locked_net_p50 / locked_net_p10 (the
  # realized locked-net distribution) together with unwind_rate_recent. If p10 is negative or the recent
  # unwind rate climbs, 0.6% was too thin.
  target_net: 0.006
  # SANITY CEILING (%): a computed edge above this is almost certainly a PRICING/PAIRING bug, not an
  # opportunity -> the quote is REJECTED + logged loudly, never placed (same doctrine as the detector's
  # max_plausible_roi_pct 8% guard). The maker's real edges are ~1%, so 5% is a wide bug-catcher.
  max_plausible_edge_pct: 5.0
  # The fee-inclusive locked net the hedge order's PRICE CAP is solved at. A hedge fills at/under that
  # cap or misses -> verified unwind, so it can never EXECUTE worse than this. -0.010 matches the
  # decline floor on purpose: locking a marginally negative pair (Cerezo's real -0.24%) is cheaper than
  # unwinding it, since an unwind pays spread + taker fee (~0.5-2%) plus brief naked exposure.
  # 0.0 = break-even, which additionally makes any pair over $1.00/share unfillable; at -0.010 the
  # fee-inclusive ceiling is $1.01/share.
  hedge_execution_floor: -0.010
  directions: [rest_poly, rest_kalshi]   # LIVE rest directions (both SMOKE-proven); shared caps + one-in-flight span them
  reserve_per_direction: 3          # of live.max_open_quotes (12), GUARANTEE 3 slots to EACH enabled direction (raised 2 -> 3 with the 8 -> 12 slot bump; rest_kalshi can't monopolize)
  debounce_ms: 250                  # quote-engine debounce
  expire_before_kickoff_s: 120      # cancel/expire every quote at kickoff - this
  poly_fee_rate: 0.05               # Polymarket sports taker rate (hedge-fee model)
  head_poll_s: 60                   # stale-code guard: exit 0 on git HEAD change (wrapper restarts fresh)
  ping_s: 10                        # Poly market-socket keepalive PING cadence
  # REPRICE HYSTERESIS (stop shredding queue position) + TELEGRAM digest (collapse routine spam).
  reprice_min_ticks: 2              # a VOLUNTARY upward reprice needs >= this many ticks of improvement
  min_rest_s: 20                    #   ...AND the live order to have rested this long (mandatory reprices ignore it)
  telegram_digest_min: 15           # routine quote/reprice/cancel collapse into one line every N min (0 = instant)
  drift_marks_s: [1, 5, 30]         # adverse-selection hedge-drift reads after each shadow fill
  kalshi_maker_fee_series: []       # Kalshi series that charge a MAKER fee -> never rest on that side
  poly_leg_cap:                     # PER-SPORT: skip a direction whose Polymarket leg price exceeds the cap
    tennis: 0.65                    #   pre-ball walkover tail: Poly settles 50c, Kalshi refunds ~last price
    ufc: 0.65                       #   pre-event cancel/draw/NC tail (HIGHER frequency than tennis walkovers)
  # (legacy `tennis_max_poly_leg: <x>` is still read as a back-compat alias for poly_leg_cap.tennis)
  # IN-PLAY shadow quoting under anti-phantom rails (SHADOW ONLY — LiveGate hard-refuses in-play even if
  # armed). A node is admitted until kickoff+horizon; quoted PRE until kickoff-120s, no quotes in the
  # 120s gap, then IN-PLAY under the rails below. All the pre-game guards still apply.
  inplay:
    horizon_hours: {soccer: 3.0, mlb: 4.5, tennis: 4.5, ufc: 1.5}   # admit a node until kickoff + this
    fresh_s: 10                     # (legacy book-change freshness; superseded by conn_fresh_s/node_quiet_max_s)
    shock_move: 0.05                # (b) a mid move >= this within shock_window_s freezes the node
    shock_window_s: 10
    freeze_s: 30                    #     freeze duration after a shock (disarm + no quotes)
    persist_ms: 1500                # (c) a direction must be continuously viable this long before arming
    # CONNECTION-based freshness (fixes quote-churn: a QUIET book on a HEALTHY socket is FRESH, not stale).
    conn_fresh_s: 30                # a venue connection is fresh if it had ANY protocol activity within this
    node_quiet_max_s: 180           # a node goes suspect only if its book hasn't ticked this long (live game)
    stale_grace_s: 5                # cancel a live order for staleness only after it holds continuously this long
  # BALANCE — the 8-HOURLY VENUE-TRUTH AUDIT (src/genz/maker_rt/balance.py). Three times a day it reads
  # both venues' cash + positions and compares the MOVEMENT against what the bot's own books claim
  # happened (settled_pnl_lifetime). The ledger is a claim; the exchanges' cash is the truth.
  # It has NO authority over trading: its own thread, its own venue clients, a hard timeout, and no
  # ability to halt, pause or slow anything. A failed check reports itself and nothing else.
  # Manual deposits/withdrawals/hand-placed trades go in data/ops/balance_adjustments.json as
  #   [{"ts": "2026-08-01T09:00:00Z", "venue": "kalshi", "usd": 1000, "note": "deposit"}]
  # (usd SIGNED the way the cash moved) — each is subtracted before the discrepancy and NAMED in the
  # report, so nothing is ever silently absorbed.
  balance:
    enabled: true
    slots_utc: [0, 8, 16]           # FIXED UTC hours (a drifting schedule can't produce comparable windows)
    alert_usd: 5.00                 # |venue movement - book movement| above this = 🔴 BOOKS DISAGREE
    timeout_s: 30                   # hard per-run deadline; past it the run is abandoned and reported failed
  # LIVE — BUILT, LOCKED. Refuses unless enabled AND the arm file exists AND the startup self-check
  # (balances on both venues, poly allowance/approvals, tick sizes) passes. DO NOT flip enabled here.
  live:
    enabled: true
    arm_file: data/ops/ARM_MAKER
    # CAPS RAISE 2026-07-28 (user directive). The live panel showed slots pinned 8/8 with a 13-minute
    # wait for a free slot, i.e. SLOT STARVATION was the binding constraint, not edge availability.
    # Sizes and slots go up together; the two SAFETY limits (max_daily_loss_usd, max_fills_per_day)
    # are deliberately UNCHANGED, so a bad day still halts at exactly the same realized loss.
    quote_usd_max: 70               # rest-leg notional cap (20 -> 70)
    max_daily_stake_usd: 800        # sum of ALL legs committed today (fills+hedges+unwinds); breach -> halt+Telegram (300 -> 800)
    # PER-PAIR cap: rest + worst-case hedge for ONE bet. MUST scale with quote_usd_max — a $70 rest
    # leg at a low price implies a hedge far above $100, so leaving this at 100 would have refused
    # nearly every quote the bigger rest leg is meant to enable (a cheap rest leg's hedge can be 16x
    # the leg: TBTOR was $1.02 rest + $15.81 hedge). 350 = 70 rest + up to 280 of hedge.
    max_pair_stake_usd: 350         # (100 -> 350)
    max_open_quotes: 12             # concurrent resting offers (8 -> 12; the starvation fix). Safe: cancels verify-or-scream + the pre-placement stack guard prevent ghost stacking, and the daily $/fill/loss caps still bound total exposure.
    # PER-GAME CONCENTRATION CAP (N15). max_open_quotes counts ORDERS and does not care that six of them
    # are one match's totals ladder: on 2026-07-29 a single match absorbed 112 placements across six
    # correlated lines, and one goal moves all six together — that is not six bets, it is one bet sized
    # six times. This is a TIGHTENING, not a raise: 12 slots still exist, but no game may hold more than
    # 3 of them, and sizing subtracts what the game already has committed (allowance defaults to
    # max_open_per_game x max_pair_stake_usd = 3 x $350 = $1,050 of projected pair per game).
    max_open_per_game: 3
    max_game_stake_usd: 0           # 0 = derive from max_open_per_game x max_pair_stake_usd
    max_fills_per_day: 20           # UNCHANGED (raised 10 -> 20 earlier on 2026-07-28)
    max_daily_loss_usd: 50          # UNCHANGED — the real exposure bound. Bigger bets do NOT get a bigger loss budget.
    hedge_timeout_ms: 3000          # miss/partial after this -> market-unwind the fill + freeze market
    unwind_on_hedge_fail: true
    # WS-INDEPENDENT FILL AUTHORITY. While ANY live order is open we poll its REST order status AND sweep
    # /portfolio/fills every this many seconds. The private websocket 'fill' channel is only an
    # ACCELERATOR -- this poll is the detector of record and needs no socket to be connected. On
    # 2026-07-23 the socket callback was silently dropped by a feed respawn and the REST path was reading
    # v1 field names against a v2 payload, so BOTH authorities were blind and two filled orders sat naked
    # for 11.5h. Never let this be the only thing you rely on, and never let it be absent.
    fill_poll_s: 10
    # SLOT AGE-OUT: a resting order older than this (s) is repriced-or-cancelled so no order holds one of
    # the scarce max_open_quotes slots forever. The live digest once showed one order held a slot for 46
    # min, behind best, while 3,042 candidates were refused (slot starvation). 0 disables.
    max_quote_age_s: 900
    # BOUNDED AUTO-FLATTEN ($). When a fill is left naked and the unwind can't prove us flat, the old
    # answer was always the same: halt everything and wait for a human. On 2026-07-28 that cost three
    # hours of quoting over a $25 position that was already one cent from flat. Now: if the WORST CASE
    # (the whole notional — what it costs if the flatten sells for nothing) is at or under this, sweep it
    # out at a capped price, prove flat against the venue, book it, and keep trading. Anything larger
    # still halts exactly as before, and a flatten that can't prove flat halts too (fails closed).
    # 120 covers a full-size pair (quote_usd_max 70 + slippage) without covering a runaway.
    auto_flatten_max_usd: 120
  # LIVE-INPLAY — the SECOND, INDEPENDENT live gate, for IN-PLAY markets only (the pre-game `live` gate
  # above is separate and unchanged). BUILT, LOCKED: an in-play live order requires BOTH enabled AND its
  # OWN arm file (data/ops/ARM_MAKER_INPLAY) AND the startup self-check. Rails are STRICTER than pre-game
  # (freeze cool-off + a hedge re-verify at fill). DO NOT flip enabled here — this build stays shadow
  # in-play. See src/genz/maker_rt/inplay_exec.py.
  live_inplay:
    # SHARED-CAPS GOVERNANCE. Every EXPOSURE limit lives in `live:` above and governs BOTH phases: there
    # is one LiveCaps, one in-flight hedge guard and one daily budget, so pre-game and in-play draw on a
    # single pool of $/slots/fills/loss. This block therefore carries only the in-play GATE and the
    # in-play CIRCUIT — the things that are actually enforced here.
    # The four per-phase cap keys that used to sit here (quote_usd_max / max_open_quotes /
    # max_fills_per_day / max_daily_loss_usd) are DELETED, not merely commented: they were never read, so
    # `quote_usd_max: 5` sat in config while in-play quotes sized against live.quote_usd_max — the
    # 5 -> 70 raise silently raised in-play sizing 14x and this file said $5 (audit N16). Re-adding any of
    # them now logs a loud NOT ENFORCED warning naming the shared cap that applies. To make in-play
    # stricter than pre-game, the caps have to become per-phase in code first.
    enabled: true                   # IN-PLAY LIVE ARMED — fully autonomous, rest-poly, under the rails + SHARED caps
    arm_file: data/ops/ARM_MAKER_INPLAY
    hedge_timeout_ms: 1500          # miss/partial after this -> market-unwind the fill + freeze market
    freeze_cooloff_s: 10            # place only after the node has been unfrozen AND both-books-fresh this long
    hedge_decline_floor: -0.010     # re-verify at fill: if the walked hedge nets below this, decline + unwind
    first_fill_pause_s: 120         # after the day's FIRST in-play fill, pause in-play placement this long (pre-game unaffected)
    halt_locked_net: -0.020         # any in-play fill with locked_net <= this HALTS in-play for the day (pre-game continues)

# ===========================================================================
# OG MULTI-SPORT (src/og_multi/) — the 4-book layer (Kalshi, Polymarket, Pinnacle, 1xbet) for
# MLB / tennis / UFC. A STANDALONE scanner: `python -m src.og_multi` runs ONE multi-sport cycle
# (per enabled sport: load the GenZ tree, fetch the-odds-api odds, match events, assemble best-of-4
# candidates, compute_arb with exact exchange fees, walk exchange legs to stake, write
# data/og_current_<sport>.json). ALERT-ONLY: no executor, no order code. The soccer OG (src/run.py)
# and every GenZ price loop are untouched. Supervised component 'og_multi'
# (scripts/run_og_multi_loop.ps1). See src/og_multi/__init__.py for the module map.
# ===========================================================================
og_multi:
  enabled_sports: [mlb, tennis, ufc]              # which sports the cycle scans (empty -> no-op)
  interval_s: {mlb: 300, tennis: 300, ufc: 600}   # per-sport cadence, enforced INSIDE via last-run stamps
  region: eu                                      # the-odds-api region (pinnacle + 1xbet are eu)
  # A fixed-book (pinnacle / 1xbet) leg whose the-odds-api last_update is older than this many minutes
  # is treated as stale and dropped (exchange legs are live, so this gate is books-only).
  age_limit_min: 30
  # the-odds-api sport keys. tennis = AUTO -> discovered from /v4/sports (group==Tennis && active),
  # cached once per scan-day to data/og_multi/toa_tennis_keys.json. mlb/ufc are static.
  toa_sports: {mlb: baseball_mlb, ufc: mma_mixed_martial_arts, tennis: AUTO}
  # Assumed executable stake ($) on a Pinnacle leg (its real limit is not in the bulk odds feed).
  # 1xbet is UNCONSTRAINED (user directive) -> sized at any depth and flagged UNVERIFIED.
  pinnacle_limit: 5000
  # Quota discipline: WARN when projected monthly the-odds-api spend exceeds this % of the plan quota
  # (plan quota = x-requests-remaining + x-requests-used from the response headers; no hardcoded total).
  quota_warn_pct: 60
